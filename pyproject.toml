[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alignment-theater"
version = "0.1.0"
description = "Fine-tuning and evaluating language models for alignment-faking behavior on synthetic-document corpora."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
# Core dependencies needed by nearly every entry point. Heavier, task-specific
# stacks live in the optional groups below — install only what you need, e.g.
#   uv pip install -e ".[judge]"      # run the LLM judges
#   uv pip install -e ".[train]"      # fine-tune models
#   uv pip install -e ".[eval,viz]"   # run evals and plot
dependencies = [
    "python-dotenv>=1.0.0",
    "fire>=0.6.0",
]

[project.optional-dependencies]
train = [
    "torch>=2.6.0,<2.9.0",
    "transformers>=5.5.0",
    "peft>=0.12.0",
    "trl>=0.10.0",
    "accelerate>=0.33.0",
    "datasets>=2.20.0",
    "huggingface-hub>=0.24.0",
    "wandb>=0.17.0",
]
eval = [
    "vllm>=0.11.0",
    "httpx>=0.28.0",
    "docent-python>=0.1.47a0",
    "numpy>=2.2.0",
    "pandas>=2.0.0",
    "tqdm>=4.67.0",
]
judge = [
    "anthropic>=0.52.0",
    "openai>=2.15.0",
    "tqdm>=4.67.0",
    "numpy>=2.2.0",
    "scipy>=1.13.0",
]
viz = [
    "matplotlib>=3.10.0",
    "numpy>=2.2.0",
    "pandas>=2.0.0",
    "scipy>=1.13.0",
    "scikit-learn>=1.4.0",
]
dev = [
    "ruff>=0.6.0",
    "black>=24.0.0",
    "pytest>=8.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["sdf", "prompting", "steering"]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    "steering",
    "sdf/af_eval", "sdf/extras",

    "results",
    "results_old",
    ".venv",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"sdf/eval/prompts.py" = ["E501"]
"sdf/extras/eval/generate_perturbations.py" = ["E501"]
"prompting/eval/prompts.py" = ["E501"]

[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = "/(steering|sdf\\/af_eval|\\.venv)/"

[tool.pytest.ini_options]
testpaths = ["sdf/tests"]
addopts = "-q"
